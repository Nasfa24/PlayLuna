<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- PWA & Mobile Viewport Optimization -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Orasi - Latihan Public Speaking</title>
    
    <!-- Fonts: Playfair for elegance, Inter for clean UI -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        /* ==========================================================================
           1. DESIGN TOKENS (AMOLED OPTIMIZED)
           ========================================================================== */
        :root {
            /* AMOLED True Black background for deep contrast */
            --bg-base: #000000;
            --bg-gradient: radial-gradient(circle at 50% 0%, #1c0e2b 0%, #000000 65%);
            
            /* Surfaces */
            --surface-color: rgba(25, 20, 35, 0.6);
            --surface-glass: rgba(255, 255, 255, 0.03);
            --surface-border: rgba(255, 255, 255, 0.08);
            
            /* Brand Colors */
            --primary: #FF5722;
            --primary-hover: #E64A19;
            --primary-glow: rgba(255, 87, 34, 0.4);
            --danger: #ff4444;
            
            /* Typography */
            --text-main: #ffffff;
            --text-muted: #9ba1a6;
            
            /* Geometry */
            --radius-pill: 999px;
            --radius-box: 24px;
            
            /* Fluid Spacing */
            --spacing-safe: env(safe-area-inset-bottom, 20px);
        }

        /* ==========================================================================
           2. BASE RESET & LAYOUT
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            background-image: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            /* 100dvh prevents issues with mobile browser address bars */
            height: 100dvh; 
            width: 100vw;
            display: grid;
            /* Grid layout ensures perfect centering regardless of 6.7" tall screens */
            grid-template-rows: auto 1fr auto; 
            overflow: hidden; 
            overscroll-behavior: none;
        }

        /* ==========================================================================
           3. UI COMPONENTS
           ========================================================================== */
        
        /* Progress Bar (Absolute Top) */
        #progress-bar-container {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: rgba(255,255,255,0.05);
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #progress-bar {
            height: 100%;
            width: 100%;
            background: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
            transition: width 0.1s linear; /* Fast transition for smooth Date.now() updates */
            transform-origin: left;
        }

        /* Header Area */
        header {
            text-align: center;
            padding: clamp(15px, 4vh, 30px) 20px 10px;
            width: 100%;
            z-index: 10;
        }

        .title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 5vw, 2.5rem);
            color: #fff;
            margin-bottom: 2px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }
        .subtitle a { color: var(--primary); text-decoration: none; }

        /* Pills & Toggles */
        .mode-container {
            margin: 15px auto 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .mode-toggle {
            display: flex;
            background: var(--surface-glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: var(--radius-pill);
            padding: 4px;
            border: 1px solid var(--surface-border);
            margin-bottom: 8px;
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px 20px;
            border-radius: var(--radius-pill);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .mode-btn.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .mode-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
            height: 1rem; /* Fixed height to prevent layout shift */
        }

        .category-select {
            background: var(--surface-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: var(--text-main);
            border: 1px solid var(--surface-border);
            padding: 12px 20px;
            border-radius: var(--radius-pill);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            appearance: none;
            text-align: center;
            width: 100%;
            max-width: 280px;
            margin-top: 5px;
            transition: border-color 0.2s;
        }
        .category-select:focus { border-color: var(--primary); }

        /* Main Stage (Always Centered) */
        .main-stage {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 0 20px;
            text-align: center;
            position: relative;
        }

        .status-label {
            color: var(--primary);
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 15px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
        }
        .status-label.show {
            opacity: 1;
            transform: translateY(0);
        }

        .topic-display {
            font-family: 'Playfair Display', serif;
            /* Fluid sizing: scales perfectly based on viewport width */
            font-size: clamp(2rem, 8vw, 3rem); 
            line-height: 1.2;
            word-break: break-word;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
            transition: opacity 0.3s ease, filter 0.1s;
        }

        .timer-display {
            font-size: clamp(4rem, 15vw, 6rem);
            font-variant-numeric: tabular-nums;
            font-weight: 700;
            display: none;
            text-shadow: 0 0 20px rgba(255,255,255,0.1);
        }

        /* Animations */
        .spinning {
            filter: blur(1px);
            opacity: 0.8;
            color: var(--primary);
            transform: scale(0.98);
        }

        @keyframes pulse-danger {
            0%, 100% { transform: scale(1); color: var(--text-main); }
            50% { transform: scale(1.05); color: var(--danger); text-shadow: 0 0 20px rgba(255,68,68,0.5); }
        }
        .timer-danger { animation: pulse-danger 1s cubic-bezier(0.4, 0, 0.2, 1) infinite; }

        @keyframes subtle-pulse {
            0% { box-shadow: 0 0 0 0 var(--primary-glow); }
            70% { box-shadow: 0 0 0 15px rgba(255, 87, 34, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 87, 34, 0); }
        }
        .btn-pulse { animation: subtle-pulse 2s infinite; }

        /* Bottom Controls (Thumb-friendly area) */
        .controls {
            display: flex;
            gap: 12px;
            padding: 15px 20px calc(25px + var(--spacing-safe));
            width: 100%;
            justify-content: center;
            background: linear-gradient(to top, var(--bg-base) 40%, transparent);
            z-index: 10;
        }

        .btn {
            background: var(--surface-color);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--text-main);
            border: 1px solid var(--surface-border);
            padding: 16px 28px;
            border-radius: var(--radius-pill);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }
        .btn:active:not(:disabled) { transform: scale(0.95); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .btn-primary {
            background: var(--primary);
            color: #fff;
            border: none;
            flex-grow: 1; /* Make main button take available space */
            max-width: 300px;
        }

        .btn-icon {
            padding: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1;
        }

        /* Modal / Bottom Sheet (Native Mobile Feel) */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }

        .modal-content {
            background: #110e17;
            width: 100%;
            max-width: 500px;
            border-radius: 28px 28px 0 0;
            padding: 30px 25px calc(35px + var(--spacing-safe));
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.3, 1, 0.3, 1);
            border-top: 1px solid var(--surface-border);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }

        .modal-header {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            margin-bottom: 25px;
            text-align: center;
        }

        .setting-group {
            margin-bottom: 20px;
            background: rgba(255,255,255,0.02);
            padding: 18px;
            border-radius: var(--radius-box);
            border: 1px solid var(--surface-border);
        }

        .setting-label {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }
        .setting-label strong { color: var(--primary); font-weight: 700; font-size: 1rem; }

        /* Custom Range Slider */
        input[type="range"] {
            width: 100%;
            background: transparent;
            -webkit-appearance: none;
        }
        input[type="range"]:focus { outline: none; }
        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
        }
        input[type="range"]::-webkit-slider-thumb {
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -9px;
            box-shadow: 0 0 10px rgba(255, 87, 34, 0.5);
            transition: transform 0.1s;
        }
        input[type="range"]::-webkit-slider-thumb:active { transform: scale(1.2); }

        /* Customized SweetAlert to match dark theme */
        .swal2-dark-theme {
            background: rgba(17, 14, 23, 0.98) !important;
            backdrop-filter: blur(15px) !important;
            border: 1px solid var(--surface-border) !important;
            border-radius: var(--radius-box) !important;
            color: #fff !important;
        }
        .swal2-title { color: #fff !important; font-family: 'Playfair Display', serif; font-size: 1.8rem !important; }
        .swal2-html-container { color: var(--text-muted) !important; font-size: 0.95rem !important; line-height: 1.5 !important;}
        .swal2-confirm { background: var(--primary) !important; border-radius: var(--radius-pill) !important; padding: 12px 30px !important; font-weight: 600 !important; }
        .swal2-cancel { background: transparent !important; border: 1px solid var(--surface-border) !important; border-radius: var(--radius-pill) !important; padding: 12px 30px !important; }
        
        /* Hide scrollbar completely but allow scrolling in modal if needed */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>

        /**
         * AUDIO ENGINE
         * Dirancang untuk berjalan aman di semua browser modern (membutuhkan interaksi user)
         */
        const AudioEngine = (function() {
            let ctx = null;

            function init() {
                if (!ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    ctx = new AudioContext();
                }
                if (ctx.state === 'suspended') ctx.resume();
            }

            function playTone(freq, type, duration, vol) {
                if (!ctx) init();
                try {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, ctx.currentTime);
                    if (type === 'triangle') { // Tick effect
                        osc.frequency.exponentialRampToValueAtTime(freq * 1.5, ctx.currentTime + duration);
                    }
                    
                    gain.gain.setValueAtTime(vol, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                    
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    
                    osc.start();
                    osc.stop(ctx.currentTime + duration);
                } catch(e) { console.warn("Audio error ignored", e); }
            }

            return {
                init,
                tick: () => playTone(800, 'triangle', 0.05, 0.1),
                beep: () => playTone(880, 'square', 0.2, 0.05),
                alarm: () => playTone(440, 'sine', 1.5, 0.4)
            };
        })();

        /**
         * APPLICATION CONTROLLER
         * Memisahkan logika aplikasi dari manipulasi DOM langsung
         */
        const App = (function() {
            // State
            const state = {
                mode: 'spontan', // spontan | riset
                status: 'idle',  // idle | spinning | ready | researching | speaking
                speechTime: 1,   // minutes
                researchTime: 10,// minutes
                targetTimeMs: 0, // Absolute end time (bulletproof against throttled intervals)
                timerRaf: null,  // requestAnimationFrame ID
                totalDuration: 0 // ms
            };

            // DOM Elements
            const DOM = {
                topic: document.getElementById('topic-text'),
                statusLabel: document.getElementById('status-label'),
                timerDisplay: document.getElementById('timer-text'),
                btnMain: document.getElementById('btn-main'),
                btnSettings: document.getElementById('btn-settings'),
                category: document.getElementById('category'),
                modeDesc: document.getElementById('mode-desc'),
                modal: document.getElementById('settings-modal'),
                progressBar: document.getElementById('progress-bar'),
                progressContainer: document.getElementById('progress-bar-container')
            };

            /** ================= MENGATUR MODE ================= */
            function setMode(mode) {
                AudioEngine.init();
                if (state.status !== 'idle' && state.status !== 'ready') {
                    confirmAction("Pindah Cara Latihan?", "Waktu sedang berjalan. Yakin ingin menghentikan latihan ini?", () => executeSetMode(mode));
                    return;
                }
                executeSetMode(mode);
            }

            function executeSetMode(mode) {
                state.mode = mode;
                document.getElementById('btn-spontan').classList.toggle('active', mode === 'spontan');
                document.getElementById('btn-riset').classList.toggle('active', mode === 'riset');
                document.getElementById('research-setting-group').style.display = mode === 'riset' ? 'block' : 'none';
                
                DOM.modeDesc.innerText = mode === 'spontan' 
                    ? "Langsung bicara tanpa persiapan sedikitpun." 
                    : "Diberi waktu cari bahan sebelum bicara.";

                resetState();
            }

            /** ================= LOGIKA UTAMA (TOMBOL TENGAH) ================= */
            async function handleMainAction() {
                AudioEngine.init();
                DOM.btnMain.disabled = true; 

                switch (state.status) {
                    case 'idle':
                        DOM.btnMain.classList.remove('btn-pulse');
                        await spinTopicAnimation();
                        break;
                    case 'ready':
                        startTimer(state.mode === 'riset' ? 'researching' : 'speaking');
                        break;
                    case 'researching':
                        confirmAction("Selesai Mencari Bahan?", "Sudah siap untuk mulai berbicara sekarang?", 
                            () => startTimer('speaking'), 
                            () => { DOM.btnMain.disabled = false; }
                        );
                        break;
                    case 'speaking':
                        confirmAction("Berhenti Berbicara?", "Waktu bicaramu belum habis. Yakin menyudahi sekarang?", 
                            resetState, 
                            () => { DOM.btnMain.disabled = false; }
                        );
                        break;
                }
            }

            /** ================= SLOT MACHINE EFFECT (EASE OUT) ================= */
            function spinTopicAnimation() {
                return new Promise(resolve => {
                    state.status = 'spinning';
                    DOM.topic.classList.add('spinning');
                    
                    const pool = TOPICS[DOM.category.value];
                    let currentSpin = 0;
                    const totalSpins = 20;
                    
                    // Fungsi recursive dengan delay yang semakin melambat (ease-out)
                    function doSpin() {
                        DOM.topic.innerText = pool[Math.floor(Math.random() * pool.length)];
                        AudioEngine.tick();
                        currentSpin++;
                        
                        if (currentSpin < totalSpins) {
                            // Delay melambat perlahan menggunakan kurva pangkat
                            const delay = Math.pow(currentSpin, 1.5) * 1.5 + 40; 
                            setTimeout(doSpin, delay);
                        } else {
                            finalizeSpin(pool);
                            resolve();
                        }
                    }
                    doSpin();
                });
            }

            function finalizeSpin(pool) {
                DOM.topic.innerText = pool[Math.floor(Math.random() * pool.length)];
                DOM.topic.classList.remove('spinning');
                
                state.status = 'ready';
                DOM.statusLabel.innerText = 'TOPIK SIAP';
                DOM.statusLabel.classList.add('show');

                DOM.btnMain.innerText = state.mode === 'spontan' 
                    ? `Mulai Bicara (${state.speechTime} Menit)` 
                    : `Mulai Riset (${state.researchTime} Menit)`;
                
                DOM.btnMain.disabled = false;
            }

            /** ================= BULLETPROOF TIMER (Date.now()) ================= */
            function startTimer(type) {
                cancelAnimationFrame(state.timerRaf);
                state.status = type;
                
                // Transisi UI (Fade Out/In)
                DOM.topic.style.opacity = '0';
                setTimeout(() => {
                    DOM.topic.style.display = 'none';
                    DOM.timerDisplay.style.display = 'block';
                    DOM.topic.style.opacity = '1';
                }, 300);

                DOM.statusLabel.innerText = type === 'researching' ? 'MENCARI BAHAN...' : 'SEDANG BERBICARA...';
                
                const minutes = type === 'researching' ? state.researchTime : state.speechTime;
                state.totalDuration = minutes * 60 * 1000;
                state.targetTimeMs = Date.now() + state.totalDuration;
                
                DOM.progressContainer.style.opacity = '1';
                DOM.timerDisplay.classList.remove('timer-danger');
                
                DOM.btnMain.innerText = type === 'researching' ? 'Lompati Riset' : 'Akhiri Latihan';
                DOM.btnMain.classList.remove('btn-primary');
                DOM.btnMain.disabled = false;

                window.onbeforeunload = () => "Sesi latihan sedang berjalan, yakin keluar?";
                
                let lastBeepTime = 0; // Prevent multiple beeps in one second
                
                // Loop Timer menggunakan RequestAnimationFrame (lebih presisi & hemat daya)
                function updateTimer() {
                    if (state.status !== type) return; // Exit if state changed

                    const now = Date.now();
                    let remainingMs = state.targetTimeMs - now;

                    if (remainingMs <= 0) {
                        timerComplete(type);
                        return;
                    }

                    // Render teks MM:SS
                    const totalSecs = Math.ceil(remainingMs / 1000);
                    const m = Math.floor(totalSecs / 60).toString().padStart(2, '0');
                    const s = (totalSecs % 60).toString().padStart(2, '0');
                    DOM.timerDisplay.innerText = `${m}:${s}`;

                    // Render Progress Bar
                    const percentage = (remainingMs / state.totalDuration) * 100;
                    DOM.progressBar.style.width = `${percentage}%`;

                    // Peringatan 5 detik terakhir
                    if (totalSecs <= 5) {
                        if (now - lastBeepTime > 900) { // Bunyi tiap ~1 detik
                            AudioEngine.beep();
                            lastBeepTime = now;
                        }
                        DOM.timerDisplay.classList.add('timer-danger');
                    }

                    state.timerRaf = requestAnimationFrame(updateTimer);
                }
                
                state.timerRaf = requestAnimationFrame(updateTimer);
            }

            function timerComplete(type) {
                cancelAnimationFrame(state.timerRaf);
                window.onbeforeunload = null;
                DOM.progressContainer.style.opacity = '0';
                DOM.timerDisplay.classList.remove('timer-danger');
                AudioEngine.alarm();
                
                if (type === 'researching') {
                    Swal.fire({
                        title: 'Waktu Riset Habis!',
                        text: 'Tarik napas yang panjang, dan mari kita mulai berbicara.',
                        icon: 'info',
                        customClass: { popup: 'swal2-dark-theme' },
                        confirmButtonText: 'Mulai Bicara',
                        allowOutsideClick: false
                    }).then(() => startTimer('speaking'));
                } else {
                    Swal.fire({
                        title: 'Waktu Habis!',
                        text: 'Latihan luar biasa! Silakan istirahatkan suaramu sebentar.',
                        icon: 'success',
                        customClass: { popup: 'swal2-dark-theme' },
                        confirmButtonText: 'Selesai'
                    }).then(resetState);
                }
            }

            function resetState() {
                cancelAnimationFrame(state.timerRaf);
                window.onbeforeunload = null;
                state.status = 'idle';
                
                DOM.timerDisplay.style.display = 'none';
                DOM.timerDisplay.classList.remove('timer-danger');
                DOM.topic.style.display = 'flex';
                DOM.topic.innerText = 'Tekan tombol untuk mengacak.';
                DOM.statusLabel.classList.remove('show');
                DOM.progressContainer.style.opacity = '0';
                
                DOM.btnMain.innerText = 'Acak Topik';
                DOM.btnMain.classList.add('btn-primary', 'btn-pulse');
                DOM.btnMain.disabled = false;
            }

            /** ================= PENGATURAN / MODAL ================= */
            function openSettings() {
                AudioEngine.init();
                if (state.status !== 'idle' && state.status !== 'ready') {
                    toastMsg("Gagal! Waktu sedang berjalan.");
                    return;
                }
                document.getElementById('slide-speech').value = state.speechTime;
                document.getElementById('slide-research').value = state.researchTime;
                updateSettingsText();
                DOM.modal.classList.add('active');
            }

            function closeSettings(e) {
                if (e.target === DOM.modal) DOM.modal.classList.remove('active');
            }

            function updateSettingsText() {
                document.getElementById('val-speech').innerText = document.getElementById('slide-speech').value + ' Menit';
                document.getElementById('val-research').innerText = document.getElementById('slide-research').value + ' Menit';
            }

            function saveSettings() {
                state.speechTime = parseInt(document.getElementById('slide-speech').value, 10);
                state.researchTime = parseInt(document.getElementById('slide-research').value, 10);
                DOM.modal.classList.remove('active');
                
                if (state.status === 'ready') {
                    DOM.btnMain.innerText = state.mode === 'spontan' 
                        ? `Mulai Bicara (${state.speechTime} Menit)` 
                        : `Mulai Riset (${state.researchTime} Menit)`;
                }
                toastMsg("Pengaturan disimpan!");
            }

            /** ================= HELPER UI ================= */
            function confirmAction(title, text, onConfirm, onCancel) {
                Swal.fire({
                    title: title,
                    text: text,
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonText: 'Ya',
                    cancelButtonText: 'Batal',
                    reverseButtons: true,
                    customClass: { popup: 'swal2-dark-theme' }
                }).then((result) => {
                    if (result.isConfirmed && onConfirm) onConfirm();
                    else if (!result.isConfirmed && onCancel) onCancel();
                });
            }

            function toastMsg(message) {
                Swal.mixin({
                    toast: true,
                    position: 'top',
                    showConfirmButton: false,
                    timer: 2000,
                    customClass: { popup: 'swal2-dark-theme' }
                }).fire({
                    icon: 'success',
                    title: message
                });
            }

            // Expose public methods
            return {
                setMode, handleMainAction, openSettings, closeSettings, updateSettingsText, saveSettings
            };
        })();
    </script>
