<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magic Chess Tournament LIVE</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,1,0" rel="stylesheet">

    <style>
        :root {
            --bg: #121212; --card: #1e1e2e; --accent: #e11d48; --text: #ffffff; --border: rgba(255,255,255,0.1);
            --input-bg: rgba(0,0,0,0.3); --success: #10b981; --danger: #ef4444;
        }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; padding-top: 60px; }
        .container { max-width: 1000px; margin: 0 auto; }
        
        /* NAVIGATION */
        .nav-bar { position: absolute; top: 15px; left: 15px; z-index: 100; }
        .btn-back {
            display: flex; align-items: center; gap: 5px; background: var(--card); color: var(--text);
            padding: 6px 12px; border-radius: 20px; text-decoration: none; font-size: 0.85rem; font-weight: 600;
            border: 1px solid var(--border); transition: 0.3s;
        }
        .btn-back:hover { background: rgba(255,255,255,0.1); }

        /* TYPOGRAPHY */
        h1 { text-align: center; color: var(--accent); margin: 0 0 5px 0; font-weight: 800; font-size: 2em; letter-spacing: 1px; }
        h2, h3 { margin-top: 0; color: var(--text); font-weight: 600; }
        .center-box { text-align: center; }

        /* LOBBY STYLE */
        #lobby-section {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999;
        }
        .lobby-card {
            background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid var(--border);
            text-align: center; max-width: 350px; width: 90%; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .lobby-input {
            padding: 15px; font-size: 1.2rem; text-align: center; text-transform: uppercase; font-family: 'Poppins', sans-serif;
            border: 2px solid var(--border); border-radius: 12px; width: 100%; box-sizing: border-box; 
            background: rgba(0,0,0,0.3); color: white; margin-bottom: 20px; letter-spacing: 2px; outline: none; transition: 0.3s;
        }
        .lobby-input:focus { border-color: var(--accent); }

        /* MAIN WRAPPER */
        #app-wrapper { display: none; } 
        
        .status-bar {
            display: flex; justify-content: space-between; align-items: center; 
            background: var(--card); padding: 10px 15px; border-radius: 12px; font-size: 0.85rem; margin-bottom: 20px; border: 1px solid var(--border);
        }
        .live-indicator { display: flex; align-items: center; gap: 5px; color: var(--danger); font-weight: bold; }
        .dot { height: 8px; width: 8px; background-color: var(--danger); border-radius: 50%; display: inline-block; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.5; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.5; } }
        
        .btn-mini { background: rgba(255,255,255,0.1); border: none; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-family: 'Poppins'; font-size: 0.8rem; font-weight: 600; }
        .btn-mini:hover { background: rgba(255,255,255,0.2); }

        /* SETUP */
        #setup-section { background: var(--card); padding: 25px; border-radius: 15px; max-width: 500px; margin: 20px auto; display: none; border: 1px solid var(--border); }
        .input-group { margin-bottom: 12px; }
        input[type="text"], select { width: 100%; padding: 12px; background: var(--input-bg); border: 1px solid var(--border); color: white; border-radius: 8px; box-sizing: border-box; font-family: 'Poppins'; outline: none; transition: 0.3s; }
        input[type="text"]:focus, select:focus { border-color: var(--accent); }
        
        button.btn-main { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 1rem; font-weight: 800; transition: 0.2s; font-family: 'Poppins'; margin-top: 10px; }
        button.btn-main:hover { filter: brightness(1.1); transform: translateY(-2px); }

        /* LAYOUT GRID */
        #app-section { display: none; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
        .game-panel, .leaderboard-panel { flex: 1; min-width: 300px; background: var(--card); padding: 25px; border-radius: 15px; border: 1px solid var(--border); }
        
        /* TABS */
        .tabs { display: flex; margin-bottom: 20px; background: var(--input-bg); border-radius: 10px; overflow: hidden; }
        .tab-btn { flex: 1; padding: 12px; background: transparent; border: none; color: #9ca3af; cursor: pointer; font-family: 'Poppins'; font-weight: 600; transition: 0.3s; }
        .tab-btn.active { background: var(--accent); color: white; }
        .game-content { display: none; }
        .game-content.active { display: block; }

        /* RANK SELECTOR UI */
        .rank-row { display: flex; align-items: center; margin-bottom: 12px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 10px; border: 1px solid var(--border); }
        .rank-label { width: 70px; font-weight: 800; font-size: 0.9rem; color: #cbd5e1; }
        .rank-points { width: 65px; text-align: center; margin-right: 15px; font-size: 0.9rem; font-weight: 600; padding: 4px; border-radius: 6px; background: rgba(255,255,255,0.05); }
        select:disabled { opacity: 0.7; cursor: not-allowed; }
        option:disabled { font-style: italic; color: #555; background: #111; }
        select { border: none; background: rgba(255,255,255,0.05); }

        /* TABLE */
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; min-width: 350px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
        th { color: #9ca3af; font-weight: 600; text-transform: uppercase; font-size: 0.85rem; }
        .rank-1 { color: #ffd700; font-weight: 800; }
        .rank-2 { color: #c0c0c0; font-weight: 800; }
        .rank-3 { color: #cd7f32; font-weight: 800; }
        .score-positive { color: var(--success); }
        .score-negative { color: var(--danger); }
        .score-neutral { color: #9ca3af; }
        
        .admin-controls { display: none; margin-top: 20px; padding-top: 15px; border-top: 1px dashed var(--border); }
        
        /* CUSTOM MODAL & TOAST */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-box { background: var(--card); padding: 25px; border-radius: 15px; width: 90%; max-width: 320px; text-align: center; border: 1px solid var(--border); }
        
        #toast { visibility: hidden; min-width: 250px; background-color: var(--success); color: #fff; text-align: center; border-radius: 8px; padding: 12px; position: fixed; z-index: 3000; left: 50%; bottom: 30px; transform: translateX(-50%); font-weight: 600; font-size: 0.9rem; box-shadow: 0 4px 15px rgba(0,0,0,0.3); opacity: 0; transition: opacity 0.3s, bottom 0.3s; }
        #toast.show { visibility: visible; opacity: 1; bottom: 50px; }

        ::-webkit-scrollbar { height: 6px; width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body>

<div class="nav-bar">
    <a href="mcgg.html" class="btn-back"><span class="material-symbols-rounded" style="font-size:18px;">arrow_back</span> Portal</a>
</div>

<!-- LOBBY -->
<div id="lobby-section">
    <div class="lobby-card">
        <h2 style="margin-top:0;">♟️ CHESS ROOM</h2>
        <p style="color:#aaa; font-size:0.85em; margin-bottom:20px;">Masukkan Kode Akses Room.<br>Contoh: <b>MEJA1</b></p>
        <input type="text" id="room-code-input" class="lobby-input" placeholder="KODE ROOM">
        <button onclick="enterRoom()" class="btn-main">MASUK ROOM</button>
    </div>
</div>

<!-- AUTH MODAL -->
<div class="modal-overlay" id="auth-modal">
    <div class="modal-box">
        <h3 style="margin-top:0;">Admin Access</h3>
        <input type="password" id="admin-pass" placeholder="Password Admin" style="margin-bottom:15px; text-align:center;">
        <div style="display:flex; gap:10px;">
            <button class="btn-main" style="background:#444;" onclick="closeModal()">Batal</button>
            <button class="btn-main" onclick="verifyAdmin()">Login</button>
        </div>
    </div>
</div>

<!-- TOAST -->
<div id="toast">Notifikasi</div>

<!-- MAIN APP -->
<div id="app-wrapper" class="container">
    <div class="status-bar">
        <div class="live-indicator">
            <span class="dot"></span> LIVE <span style="color:#888; font-weight:normal; margin-left:8px;" id="display-room-id"></span>
        </div>
        <div style="display:flex; gap:10px; align-items:center;">
            <span class="material-symbols-rounded" style="cursor:pointer; color:#9ca3af;" onclick="copyLink()" title="Share Link">share</span>
            <button id="btn-login" class="btn-mini" onclick="openModal()">Admin</button>
        </div>
    </div>

    <h1>🏆 MAGIC CHESS</h1>

    <div id="setup-section">
        <h2 style="text-align:center;">Setup Pemain</h2>
        <p style="text-align:center; color:#888; font-size:0.85rem; margin-top:-10px;">Daftarkan ke-8 pemain yang bertanding</p>
        <div id="player-inputs"></div>
        <button class="btn-main" onclick="saveSetupToFirebase()">SIMPAN & MULAI TURNAMEN</button>
    </div>

    <div id="app-section">
        <!-- GAME PANEL -->
        <div class="game-panel">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab(1)">Game 1</button>
                <button class="tab-btn" onclick="switchTab(2)">Game 2</button>
                <button class="tab-btn" onclick="switchTab(3)">Game 3</button>
            </div>
            <div id="game-forms">
                <p style="text-align:center; color:#888; padding:30px;">Memuat data sinkronisasi...</p>
            </div>
        </div>

        <!-- LEADERBOARD PANEL -->
        <div class="leaderboard-panel">
            <h2 style="display:flex; align-items:center; gap:8px;"><span class="material-symbols-rounded">leaderboard</span> Klasemen</h2>
            <div class="table-responsive">
                <table>
                    <thead><tr><th>Rank</th><th>Nama</th><th>G1</th><th>G2</th><th>G3</th><th style="text-align:right;">Total</th></tr></thead>
                    <tbody id="leaderboard-body"></tbody>
                </table>
            </div>
            
            <div class="admin-controls" id="admin-panel">
                <p style="color: #aaa; font-size: 0.85em; text-align: center; margin-bottom:10px;">⚙️ Mode Admin Aktif</p>
                <div style="display:flex; gap:10px;">
                    <button class="btn-main" onclick="showSetup()" style="background-color: #4b5563; font-size:0.8rem; padding:10px;">Edit Pemain</button>
                    <button class="btn-main" onclick="resetTournament()" style="background-color: var(--danger); font-size:0.8rem; padding:10px;">Hapus Room</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // --- KONFIGURASI FIREBASE (Sesuai original) ---
    const firebaseConfig = {
        apiKey: "AIzaSyDLiGNB82sYfYVEd4OHx1eAXScaLrA5-Ps",
        authDomain: "mcgg-turney.firebaseapp.com",
        databaseURL: "https://mcgg-turney-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "mcgg-turney",
        storageBucket: "mcgg-turney.firebasestorage.app",
        messagingSenderId: "475861111074",
        appId: "1:475861111074:web:3c637d7ee44ecd71a9157b",
        measurementId: "G-PMDETSSGYS"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const POINT_SYSTEM = [7, 5, 3, 1, 0, -2, -4, -6];
    let players = [];
    let isAdmin = false;
    let gameResults = { 1: {}, 2: {}, 3: {} };
    let CURRENT_ROOM = null;

    // --- UI HELPERS ---
    function showToast(message, isError = false) {
        const toast = document.getElementById("toast");
        toast.innerText = message;
        toast.style.backgroundColor = isError ? "var(--danger)" : "var(--success)";
        toast.className = "show";
        setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
    }

    function openModal() { document.getElementById('auth-modal').style.display = 'flex'; document.getElementById('admin-pass').focus(); }
    function closeModal() { document.getElementById('auth-modal').style.display = 'none'; document.getElementById('admin-pass').value = ''; }

    // --- SYSTEM LOBBY ---
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        if(code) {
            document.getElementById('room-code-input').value = code;
            enterRoom();
        }
    };

    function enterRoom() {
        const inputCode = document.getElementById('room-code-input').value.toUpperCase().trim().replace(/[^A-Z0-9]/g, '');
        if(!inputCode) { showToast("Masukkan Kode Room dulu!", true); return; }
        
        CURRENT_ROOM = inputCode;
        document.getElementById('lobby-section').style.display = 'none';
        document.getElementById('app-wrapper').style.display = 'block';
        document.getElementById('display-room-id').innerText = `${CURRENT_ROOM}`;
        
        const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?code=' + CURRENT_ROOM;
        window.history.pushState({path:newUrl},'',newUrl);

        initApp();
    }

    function copyLink() {
        const url = window.location.href;
        navigator.clipboard.writeText(url).then(() => showToast("Link tersalin! Bagikan ke penonton."));
    }

    // --- LOGIKA UTAMA ---
    function initApp() {
        const playerInputsContainer = document.getElementById('player-inputs');
        playerInputsContainer.innerHTML = '';
        for (let i = 1; i <= 8; i++) {
            playerInputsContainer.innerHTML += `<div class="input-group"><input type="text" id="p${i}" placeholder="Pemain ${i}"></div>`;
        }

        db.ref('tournaments/' + CURRENT_ROOM).on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                players = data.players || [];
                gameResults = data.results || { 1: {}, 2: {}, 3: {} };
                
                if (players.length > 0) {
                    document.getElementById('setup-section').style.display = 'none';
                    document.getElementById('app-section').style.display = 'flex';
                    generateGameForms(); 
                    updateLeaderboardUI();
                }
            } else {
                if (isAdmin) {
                    document.getElementById('setup-section').style.display = 'block';
                    document.getElementById('app-section').style.display = 'none';
                } else {
                    document.getElementById('game-forms').innerHTML = '<p style="text-align:center; padding:40px; color:#aaa;"><span class="material-symbols-rounded" style="font-size:3em; display:block; margin-bottom:10px;">hourglass_empty</span>Menunggu Admin Setup Room</p>';
                }
            }
        });
    }

    function generateGameForms() {
        const container = document.getElementById('game-forms');
        const scrollPos = container.scrollTop;
        
        let activeTab = 1;
        document.querySelectorAll('.game-content').forEach((el, idx) => { if(el.classList.contains('active')) activeTab = idx + 1; });

        container.innerHTML = '';

        for (let gameId = 1; gameId <= 3; gameId++) {
            let isActive = (gameId === activeTab) ? 'active' : '';
            let html = `<div id="game-${gameId}" class="game-content ${isActive}">`;
            
            for (let rank = 1; rank <= 8; rank++) {
                let points = POINT_SYSTEM[rank-1];
                let pointClass = points > 0 ? 'score-positive' : (points < 0 ? 'score-negative' : 'score-neutral');
                let pointDisplay = points > 0 ? `+${points}` : points;
                let selectedPlayer = (gameResults[gameId] && gameResults[gameId][rank]) ? gameResults[gameId][rank] : "";

                html += `
                <div class="rank-row">
                    <div class="rank-label">Rank ${rank}</div>
                    <div class="rank-points ${pointClass}">${pointDisplay}</div>
                    <select id="g${gameId}-r${rank}" style="flex:1;" onchange="handleSelection(${gameId}, ${rank}, this.value)" ${isAdmin ? '' : 'disabled'}>
                        <option value="">-- ${isAdmin ? 'Pilih Pemain' : 'Belum Selesai'} --</option>
                        ${players.map(p => `<option value="${p}" ${p === selectedPlayer ? 'selected' : ''}>${p}</option>`).join('')}
                    </select>
                </div>`;
            }
            html += `</div>`;
            container.innerHTML += html;
            if(isAdmin) refreshDropdownOptions(gameId);
        }
        container.scrollTop = scrollPos;
    }

    function refreshDropdownOptions(gameId) {
        let selectedInThisGame = [];
        for (let r = 1; r <= 8; r++) {
            let el = document.getElementById(`g${gameId}-r${r}`);
            if (el && el.value) selectedInThisGame.push(el.value);
        }
        for (let r = 1; r <= 8; r++) {
            let el = document.getElementById(`g${gameId}-r${r}`);
            if (!el) continue;
            let myValue = el.value;
            let options = el.querySelectorAll('option');
            options.forEach(opt => {
                if (opt.value === "") return;
                if (selectedInThisGame.includes(opt.value) && opt.value !== myValue) {
                    opt.disabled = true; opt.innerText = `(Terpilih) ${opt.value}`;
                } else {
                    opt.disabled = false; opt.innerText = opt.value;
                }
            });
        }
    }

    // --- ACTIONS ---
    function handleSelection(gameId, rank, playerName) {
        if (!isAdmin) return;
        refreshDropdownOptions(gameId);
        db.ref(`tournaments/${CURRENT_ROOM}/results/${gameId}/${rank}`).set(playerName);
    }

    function switchTab(gameId) {
        document.querySelectorAll('.tab-btn').forEach((btn, index) => btn.classList.toggle('active', index + 1 === gameId));
        document.querySelectorAll('.game-content').forEach(content => content.classList.remove('active'));
        const activeContent = document.getElementById(`game-${gameId}`);
        if(activeContent) activeContent.classList.add('active');
    }

    function updateLeaderboardUI() {
        let leaderboard = players.map(p => ({ name: p, g1: 0, g2: 0, g3: 0, total: 0 }));

        for (let g = 1; g <= 3; g++) {
            if (gameResults[g]) {
                for (let rank = 1; rank <= 8; rank++) {
                    let playerName = gameResults[g][rank];
                    if (playerName) {
                        let points = POINT_SYSTEM[rank-1];
                        let pData = leaderboard.find(p => p.name === playerName);
                        if (pData) {
                            if (g === 1) pData.g1 = points;
                            if (g === 2) pData.g2 = points;
                            if (g === 3) pData.g3 = points;
                            pData.total += points;
                        }
                    }
                }
            }
        }
        leaderboard.sort((a, b) => b.total - a.total);
        const tbody = document.getElementById('leaderboard-body');
        tbody.innerHTML = '';

        leaderboard.forEach((p, index) => {
            let rankClass = index === 0 ? 'rank-1' : (index === 1 ? 'rank-2' : (index === 2 ? 'rank-3' : ''));
            tbody.innerHTML += `
            <tr>
                <td class="${rankClass}">#${index + 1}</td>
                <td class="${rankClass}" style="font-weight:600;">${p.name}</td>
                <td style="color:${p.g1>0?'var(--success)':(p.g1<0?'var(--danger)':'#aaa')}">${p.g1}</td>
                <td style="color:${p.g2>0?'var(--success)':(p.g2<0?'var(--danger)':'#aaa')}">${p.g2}</td>
                <td style="color:${p.g3>0?'var(--success)':(p.g3<0?'var(--danger)':'#aaa')}">${p.g3}</td>
                <td style="font-weight:800; font-size:1.1em; text-align:right;">${p.total}</td>
            </tr>`;
        });
    }

    function saveSetupToFirebase() {
        let newPlayers = [];
        for (let i = 1; i <= 8; i++) {
            let name = document.getElementById(`p${i}`).value.trim();
            if(!name) name = `Player ${i}`;
            newPlayers.push(name);
        }
        if(confirm(`Konfirmasi menyimpan data pemain untuk Room ${CURRENT_ROOM}?`)) {
            db.ref(`tournaments/${CURRENT_ROOM}`).set({
                players: newPlayers,
                results: { 1: {}, 2: {}, 3: {} }
            }).then(() => showToast("Setup berhasil disimpan!"));
        }
    }

    function resetTournament() {
        if(confirm(`⚠️ Hapus PERMANEN data Room ${CURRENT_ROOM}?`)) {
            db.ref(`tournaments/${CURRENT_ROOM}`).remove().then(() => {
                showToast("Room dihapus. Mereset web...");
                setTimeout(() => location.reload(), 1500);
            });
        }
    }
    
    function showSetup() {
        document.getElementById('setup-section').style.display = 'block';
        document.getElementById('app-section').style.display = 'none';
        players.forEach((p, i) => { if(document.getElementById(`p${i+1}`)) document.getElementById(`p${i+1}`).value = p; });
    }

    function verifyAdmin() {
        const pass = document.getElementById('admin-pass').value;
        if(pass === "admin123") {
            isAdmin = true;
            document.getElementById('btn-login').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
            closeModal();
            let selects = document.querySelectorAll('select');
            selects.forEach(s => s.disabled = false);
            if(players.length === 0) document.getElementById('setup-section').style.display = 'block';
            generateGameForms();
            showToast("Admin Mode Diaktifkan!");
        } else {
            showToast("Password Salah!", true);
        }
    }
</script>

</body>
</html>
