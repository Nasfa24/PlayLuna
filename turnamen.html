<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magic Chess Tournament LIVE - Pro Edition</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,1,0" rel="stylesheet">

    <style>
        /* --- CORE DESIGN SYSTEM --- */
        :root {
            --bg-dark: #0f0a0f;
            --bg-gradient: radial-gradient(circle at top center, #2e0e16, #0f0a0f);
            --card-bg: rgba(30, 20, 25, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent: #e11d48;
            --accent-hover: #be123c;
            --accent-glow: 0 0 20px rgba(225, 29, 72, 0.4);
            --success: #10b981;
            --danger: #ef4444;
            --danger-glow: 0 0 20px rgba(239, 68, 68, 0.4);
            --text-main: #f8fafc;
            --text-muted: #a1a1aa;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body { font-family: 'Outfit', sans-serif; background: var(--bg-dark); background-image: var(--bg-gradient); color: var(--text-main); margin: 0; padding: 0; min-height: 100vh; overscroll-behavior-y: none; }
        
        /* --- UTILITIES & GLASSMORPHISM --- */
        .glass { background: var(--card-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--card-border); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); }
        .hidden { display: none !important; }
        .container { max-width: 1100px; margin: 0 auto; padding: 80px 20px 40px 20px; }

        /* --- NAVIGATION --- */
        .nav-bar { position: fixed; top: 0; left: 0; width: 100%; padding: 15px 20px; z-index: 100; box-sizing: border-box; background: rgba(15,10,15,0.8); backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); }
        .btn-back { display: inline-flex; align-items: center; gap: 8px; color: var(--text-main); text-decoration: none; font-weight: 600; font-size: 0.9rem; padding: 8px 16px; border-radius: 20px; background: rgba(255,255,255,0.05); transition: var(--transition); border: 1px solid transparent; }
        .btn-back:hover { background: rgba(255,255,255,0.1); border-color: var(--card-border); transform: translateX(-2px); }

        /* --- TYPOGRAPHY --- */
        h1 { text-align: center; background: linear-gradient(to right, #fda4af, #e11d48); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0 0 5px 0; font-weight: 800; font-size: 2.5em; letter-spacing: -0.5px; }
        h2, h3 { margin-top: 0; font-weight: 600; }

        /* --- LOBBY --- */
        #lobby-section { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 99; background: var(--bg-dark); }
        .lobby-card { border-radius: 24px; padding: 40px; width: 90%; max-width: 400px; text-align: center; }
        .lobby-input { width: 100%; padding: 18px; font-size: 1.5rem; text-align: center; text-transform: uppercase; background: rgba(0,0,0,0.5); color: white; border: 2px solid var(--card-border); border-radius: 16px; margin-bottom: 24px; outline: none; transition: var(--transition); font-family: 'Outfit'; font-weight: 800; letter-spacing: 4px; box-sizing: border-box; }
        .lobby-input:focus { border-color: var(--accent); box-shadow: var(--accent-glow); transform: translateY(-2px); }

        /* --- STATUS BAR --- */
        .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-radius: 16px; margin-bottom: 25px; font-size: 0.9rem; font-weight: 600; }
        .live-indicator { display: flex; align-items: center; gap: 8px; color: var(--danger); text-shadow: var(--danger-glow); }
        .dot { height: 10px; width: 10px; background-color: var(--danger); border-radius: 50%; display: inline-block; animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; box-shadow: var(--danger-glow); }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .5; transform: scale(1.2); } }

        /* --- SETUP LAYOUT --- */
        #setup-section { max-width: 600px; margin: 20px auto; padding: 30px; border-radius: 24px; }
        .input-group { margin-bottom: 15px; }
        input[type="text"], select { width: 100%; padding: 15px 18px; background: rgba(0,0,0,0.4); border: 1px solid var(--card-border); color: white; border-radius: 12px; box-sizing: border-box; font-family: 'Outfit'; outline: none; transition: var(--transition); font-size: 1rem; }
        input[type="text"]:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.2); }

        /* --- GRID & PANELS --- */
        #app-section { display: none; flex-wrap: wrap; gap: 25px; margin-top: 20px; }
        .game-panel, .leaderboard-panel { flex: 1; min-width: 320px; padding: 25px; border-radius: 20px; }
        
        /* --- TABS --- */
        .tabs { display: flex; margin-bottom: 25px; background: rgba(0,0,0,0.3); border-radius: 14px; padding: 6px; }
        .tab-btn { flex: 1; padding: 12px; background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-family: 'Outfit'; font-weight: 600; border-radius: 10px; transition: var(--transition); font-size: 0.95rem; }
        .tab-btn:hover:not(.active) { color: white; background: rgba(255,255,255,0.05); }
        .tab-btn.active { background: var(--accent); color: white; box-shadow: var(--accent-glow); }
        .game-content { display: none; }
        .game-content.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* --- RANK SELECTOR --- */
        .rank-row { display: flex; align-items: center; margin-bottom: 12px; background: rgba(0,0,0,0.25); padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.03); transition: var(--transition); }
        .rank-row:hover { background: rgba(255,255,255,0.03); border-color: rgba(255,255,255,0.1); }
        .rank-label { width: 75px; font-weight: 800; font-size: 0.95rem; color: #e2e8f0; }
        .rank-points { width: 65px; text-align: center; margin-right: 15px; font-size: 0.9rem; font-weight: 800; padding: 6px; border-radius: 8px; background: rgba(255,255,255,0.05); }
        select { background: rgba(0,0,0,0.3); padding: 10px 14px; }
        select:disabled { opacity: 0.6; cursor: not-allowed; }
        option:disabled { font-style: italic; color: #555; }

        /* --- TABLE --- */
        .table-responsive { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: separate; border-spacing: 0 6px; min-width: 400px; }
        th { text-align: left; color: var(--text-muted); padding: 0 12px 10px; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        td { padding: 14px 12px; background: rgba(255,255,255,0.02); font-size: 1rem; border-top: 1px solid rgba(255,255,255,0.01); border-bottom: 1px solid rgba(255,255,255,0.01); }
        td:first-child { border-left: 1px solid rgba(255,255,255,0.01); border-radius: 10px 0 0 10px; }
        td:last-child { border-right: 1px solid rgba(255,255,255,0.01); border-radius: 0 10px 10px 0; text-align: right; }
        tr:hover td { background: rgba(255,255,255,0.05); }
        
        .rank-1 { color: #fbbf24; font-weight: 800; text-shadow: 0 0 10px rgba(251, 191, 36, 0.4); }
        .rank-2 { color: #94a3b8; font-weight: 800; }
        .rank-3 { color: #d97706; font-weight: 800; }
        .score-positive { color: var(--success); }
        .score-negative { color: var(--danger); }
        .score-neutral { color: var(--text-muted); }
        
        .admin-controls { display: none; margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--card-border); }
        
        /* --- BUTTONS --- */
        button { cursor: pointer; font-family: 'Outfit'; transition: var(--transition); position: relative; overflow: hidden; }
        button:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }
        .btn-main { width: 100%; padding: 16px; background: var(--accent); border: none; border-radius: 14px; font-weight: 800; color: white; font-size: 1rem; margin-top: 15px; box-shadow: var(--accent-glow); letter-spacing: 1px; text-transform: uppercase; }
        .btn-main:hover:not(:disabled) { background: var(--accent-hover); transform: translateY(-3px); box-shadow: 0 8px 25px rgba(225, 29, 72, 0.5); }
        .btn-main:active:not(:disabled) { transform: translateY(1px); }
        .btn-danger { background: var(--danger); box-shadow: var(--danger-glow); }
        .btn-danger:hover:not(:disabled) { background: #dc2626; box-shadow: 0 8px 25px rgba(239, 68, 68, 0.5); }

        /* --- MODAL ENGINE --- */
        #ui-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; display: flex; align-items: center; justify-content: center; }
        #ui-overlay.active { opacity: 1; pointer-events: all; }
        .dialog-box { width: 90%; max-width: 360px; padding: 30px; border-radius: 24px; text-align: center; transform: scale(0.9) translateY(20px); opacity: 0; transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        #ui-overlay.active .dialog-box { transform: scale(1) translateY(0); opacity: 1; }
        .dialog-icon { font-size: 48px; margin-bottom: 15px; display: inline-block; }
        .dialog-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 10px; }
        .dialog-message { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 25px; line-height: 1.5; }
        .dialog-actions { display: flex; gap: 12px; }
        .dialog-actions button { flex: 1; margin-top: 0; padding: 14px; }
        .btn-outline { background: transparent; border: 2px solid var(--card-border); box-shadow: none; }
        .btn-outline:hover:not(:disabled) { border-color: white; background: rgba(255,255,255,0.05); }
        
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; border-color: var(--danger) !important; box-shadow: var(--danger-glow) !important; }

        /* --- TOASTS --- */
        #toast-container { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 3000; display: flex; flex-direction: column; gap: 10px; align-items: center; pointer-events: none; }
        .toast { background: rgba(30, 20, 25, 0.95); backdrop-filter: blur(10px); border: 1px solid var(--card-border); color: white; padding: 14px 24px; border-radius: 100px; font-weight: 600; font-size: 0.9rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 10px; animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .toast.success .t-icon { color: var(--success); }
        .toast.error .t-icon { color: var(--danger); }
        .toast.fadeOut { animation: fadeOut 0.4s forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes fadeOut { to { opacity: 0; transform: translateY(-10px) scale(0.9); } }

        /* SCROLLBAR */
        ::-webkit-scrollbar { height: 6px; width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body>

<div class="nav-bar">
    <a href="mcgg.html" class="btn-back"><span class="material-symbols-rounded">arrow_back_ios_new</span> Portal</a>
    <div style="display:flex; gap:10px; align-items:center;">
        <span class="material-symbols-rounded" style="cursor:pointer; color:var(--text-muted); font-size: 20px;" onclick="copyLink()" title="Share Link">share</span>
        <button id="btn-login" class="btn-back" style="border-radius:8px; padding: 6px 12px; margin:0;" onclick="UI.showAuthModal()">Admin</button>
    </div>
</div>

<!-- LOBBY -->
<div id="lobby-section">
    <div class="lobby-card glass">
        <span class="material-symbols-rounded" style="font-size: 48px; color: var(--accent); margin-bottom: 10px; display: block;">chess</span>
        <h2 style="margin-top:0;">CHESS BOARD</h2>
        <p style="color:var(--text-muted); font-size:0.9em; margin-bottom:30px;">Enter Table Code</p>
        <input type="text" id="room-code-input" class="lobby-input" placeholder="CODE">
        <button onclick="enterRoom()" class="btn-main">JOIN TABLE</button>
    </div>
</div>

<!-- CUSTOM DIALOG ENGINE -->
<div id="ui-overlay">
    <div class="dialog-box glass" id="ui-dialog"></div>
</div>

<!-- TOAST CONTAINER -->
<div id="toast-container"></div>

<!-- MAIN APP -->
<div id="app-wrapper" class="container hidden">
    
    <div class="status-bar glass">
        <div class="live-indicator"><span class="dot"></span> LIVE TABLE</div>
        <div style="color:var(--text-muted);">ID: <strong style="color:white; letter-spacing: 1px;" id="display-room-id"></strong></div>
    </div>

    <h1>MAGIC CHESS</h1>

    <div id="setup-section" class="glass hidden">
        <h2 style="text-align:center; color: var(--accent);"><span class="material-symbols-rounded" style="vertical-align: middle;">group_add</span> Roster Setup</h2>
        <p style="text-align:center; color:var(--text-muted); font-size:0.9rem; margin-top:-5px; margin-bottom:25px;">Register all 8 commanders for this table.</p>
        <div id="player-inputs"></div>
        <button class="btn-main" onclick="saveSetupToFirebase()" id="btn-save-setup">INITIALIZE TOURNAMENT</button>
    </div>

    <div id="app-section">
        <!-- GAME PANEL -->
        <div class="game-panel glass">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab(1)">Match 1</button>
                <button class="tab-btn" onclick="switchTab(2)">Match 2</button>
                <button class="tab-btn" onclick="switchTab(3)">Match 3</button>
            </div>
            <div id="game-forms">
                <p style="text-align:center; color:var(--text-muted); padding:40px;"><span class="material-symbols-rounded" style="font-size:3em; display:block; margin-bottom:10px; animation: pulse 2s infinite;">sync</span>Syncing Matrix...</p>
            </div>
        </div>

        <!-- LEADERBOARD PANEL -->
        <div class="leaderboard-panel glass">
            <h2 style="display:flex; align-items:center; gap:8px; margin-bottom: 20px;"><span class="material-symbols-rounded" style="color: var(--accent);">leaderboard</span> Standings</h2>
            <div class="table-responsive">
                <table>
                    <thead><tr><th>Pos</th><th>Commander</th><th>M1</th><th>M2</th><th>M3</th><th style="text-align:right;">Total</th></tr></thead>
                    <tbody id="leaderboard-body"></tbody>
                </table>
            </div>
            
            <div class="admin-controls" id="admin-panel">
                <p style="color: var(--accent); font-size: 0.85em; text-align: center; margin-bottom:15px; font-weight:800; letter-spacing:1px;">⚠️ OVERRIDE ACTIVE</p>
                <div style="display:flex; gap:12px;">
                    <button class="btn-main btn-outline" onclick="showSetup()" style="font-size:0.85rem; padding:12px;"><span class="material-symbols-rounded" style="font-size: 16px; vertical-align: middle;">edit</span> Edit Roster</button>
                    <button class="btn-main btn-danger" onclick="resetTournament()" id="btn-del-room" style="font-size:0.85rem; padding:12px;"><span class="material-symbols-rounded" style="font-size: 16px; vertical-align: middle;">delete_forever</span> Terminate</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    /** ==========================================
     *  CORE CONFIGURATION & STATE
     *  ========================================== */
    const firebaseConfig = {
        apiKey: "AIzaSyDLiGNB82sYfYVEd4OHx1eAXScaLrA5-Ps",
        authDomain: "mcgg-turney.firebaseapp.com",
        databaseURL: "https://mcgg-turney-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "mcgg-turney",
        storageBucket: "mcgg-turney.firebasestorage.app",
        messagingSenderId: "475861111074",
        appId: "1:475861111074:web:3c637d7ee44ecd71a9157b",
        measurementId: "G-PMDETSSGYS"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const POINT_SYSTEM = [7, 5, 3, 1, 0, -2, -4, -6];
    let players = [];
    let isAdmin = false;
    let gameResults = { 1: {}, 2: {}, 3: {} };
    let CURRENT_ROOM = null;
    let isProcessing = false;

    /** ==========================================
     *  UI ENGINE (Modals, Toasts, Locks)
     *  ========================================== */
    const UI = {
        toast: (message, type = 'success') => {
            const container = document.getElementById('toast-container');
            const el = document.createElement('div');
            const icon = type === 'success' ? 'check_circle' : (type === 'error' ? 'error' : 'info');
            el.className = `toast ${type}`;
            el.innerHTML = `<span class="material-symbols-rounded t-icon">${icon}</span> ${message}`;
            container.appendChild(el);
            setTimeout(() => { el.classList.add('fadeOut'); setTimeout(() => el.remove(), 400); }, 3500);
        },

        confirm: (title, message, isDanger = false) => {
            return new Promise((resolve) => {
                const overlay = document.getElementById('ui-overlay');
                const dialog = document.getElementById('ui-dialog');
                const icon = isDanger ? 'warning' : 'help';
                const iconColor = isDanger ? 'var(--danger)' : 'var(--accent)';
                const btnClass = isDanger ? 'btn-danger' : 'btn-main';
                
                dialog.innerHTML = `
                    <span class="material-symbols-rounded dialog-icon" style="color: ${iconColor}">${icon}</span>
                    <div class="dialog-title">${title}</div>
                    <div class="dialog-message">${message}</div>
                    <div class="dialog-actions">
                        <button class="btn-main btn-outline" id="dlg-cancel">Cancel</button>
                        <button class="${btnClass}" id="dlg-confirm">Proceed</button>
                    </div>`;
                overlay.classList.add('active');
                document.getElementById('dlg-cancel').onclick = () => { overlay.classList.remove('active'); resolve(false); };
                document.getElementById('dlg-confirm').onclick = () => { overlay.classList.remove('active'); resolve(true); };
            });
        },

        showAuthModal: () => {
            const overlay = document.getElementById('ui-overlay');
            const dialog = document.getElementById('ui-dialog');
            dialog.className = 'dialog-box glass';
            dialog.innerHTML = `
                <span class="material-symbols-rounded dialog-icon" style="color: var(--accent)">security</span>
                <div class="dialog-title">Master Override</div>
                <div class="dialog-message">Requires authorization code to unlock matrix.</div>
                <input type="password" id="admin-pass" placeholder="Code" style="margin-bottom:20px; text-align:center; letter-spacing:4px; font-weight:800;">
                <div class="dialog-actions">
                    <button class="btn-main btn-outline" onclick="document.getElementById('ui-overlay').classList.remove('active')">Abort</button>
                    <button class="btn-main" onclick="verifyAdmin()">Decrypt</button>
                </div>`;
            overlay.classList.add('active');
            setTimeout(() => document.getElementById('admin-pass').focus(), 100);
        },

        permissionDenied: (message = "Access Denied") => {
            const dialog = document.getElementById('ui-dialog');
            dialog.classList.remove('shake');
            void dialog.offsetWidth; 
            dialog.classList.add('shake');
            UI.toast(message, 'error');
        },

        setLoading: (btnId, isLoading) => {
            const btn = document.getElementById(btnId);
            if(!btn) return;
            if(isLoading) {
                btn.dataset.original = btn.innerHTML;
                btn.innerHTML = `<span class="material-symbols-rounded" style="animation: pulse 1s infinite;">sync</span> Processing...`;
                btn.disabled = true;
            } else {
                btn.innerHTML = btn.dataset.original;
                btn.disabled = false;
            }
        }
    };

    /** ==========================================
     *  LOBBY SYSTEM
     *  ========================================== */
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        if(code) { document.getElementById('room-code-input').value = code; enterRoom(); }
    };

    function enterRoom() {
        const input = document.getElementById('room-code-input');
        const inputCode = input.value.toUpperCase().trim().replace(/[^A-Z0-9]/g, '');
        if(!inputCode) { 
            input.classList.add('shake'); setTimeout(() => input.classList.remove('shake'), 500);
            UI.toast("Provide a Table Code", "error"); return; 
        }
        
        CURRENT_ROOM = inputCode;
        document.getElementById('lobby-section').classList.add('hidden');
        document.getElementById('app-wrapper').classList.remove('hidden');
        document.getElementById('display-room-id').innerText = `${CURRENT_ROOM}`;
        
        const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?code=' + CURRENT_ROOM;
        window.history.pushState({path:newUrl},'',newUrl);

        initApp();
        UI.toast(`Connected to Table: ${CURRENT_ROOM}`);
    }

    function copyLink() {
        navigator.clipboard.writeText(window.location.href).then(() => UI.toast("Table URL copied!"));
    }

    /** ==========================================
     *  APP LOGIC & SYNC
     *  ========================================== */
    function initApp() {
        const playerInputsContainer = document.getElementById('player-inputs');
        playerInputsContainer.innerHTML = '';
        for (let i = 1; i <= 8; i++) {
            playerInputsContainer.innerHTML += `<div class="input-group"><input type="text" id="p${i}" placeholder="Commander ${i}"></div>`;
        }

        db.ref('tournaments/' + CURRENT_ROOM).on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                players = data.players || [];
                gameResults = data.results || { 1: {}, 2: {}, 3: {} };
                
                if (players.length > 0) {
                    document.getElementById('setup-section').classList.add('hidden');
                    document.getElementById('app-section').style.display = 'flex';
                    generateGameForms(); 
                    updateLeaderboardUI();
                }
            } else {
                if (isAdmin) {
                    document.getElementById('setup-section').classList.remove('hidden');
                    document.getElementById('app-section').style.display = 'none';
                } else {
                    document.getElementById('game-forms').innerHTML = '<div style="text-align:center; padding:60px 20px;"><span class="material-symbols-rounded" style="font-size:4em; color:var(--text-muted); margin-bottom:15px; display:block;">hourglass_top</span><h3 style="color:var(--text-muted);">Waiting for Admin setup</h3></div>';
                }
            }
        });
    }

    function generateGameForms() {
        const container = document.getElementById('game-forms');
        const scrollPos = container.scrollTop;
        
        let activeTab = 1;
        document.querySelectorAll('.game-content').forEach((el, idx) => { if(el.classList.contains('active')) activeTab = idx + 1; });

        container.innerHTML = '';

        for (let gameId = 1; gameId <= 3; gameId++) {
            let isActive = (gameId === activeTab) ? 'active' : '';
            let html = `<div id="game-${gameId}" class="game-content ${isActive}">`;
            
            for (let rank = 1; rank <= 8; rank++) {
                let points = POINT_SYSTEM[rank-1];
                let pointClass = points > 0 ? 'score-positive' : (points < 0 ? 'score-negative' : 'score-neutral');
                let pointDisplay = points > 0 ? `+${points}` : points;
                let selectedPlayer = (gameResults[gameId] && gameResults[gameId][rank]) ? gameResults[gameId][rank] : "";

                html += `
                <div class="rank-row">
                    <div class="rank-label">Rank ${rank}</div>
                    <div class="rank-points ${pointClass}">${pointDisplay}</div>
                    <select id="g${gameId}-r${rank}" style="flex:1;" onchange="handleSelection(${gameId}, ${rank}, this.value)" ${isAdmin ? '' : 'disabled'}>
                        <option value="">-- ${isAdmin ? 'Select Commander' : 'Pending'} --</option>
                        ${players.map(p => `<option value="${p}" ${p === selectedPlayer ? 'selected' : ''}>${p}</option>`).join('')}
                    </select>
                </div>`;
            }
            html += `</div>`;
            container.innerHTML += html;
            if(isAdmin) refreshDropdownOptions(gameId);
        }
        container.scrollTop = scrollPos;
    }

    function refreshDropdownOptions(gameId) {
        let selectedInThisGame = [];
        for (let r = 1; r <= 8; r++) {
            let el = document.getElementById(`g${gameId}-r${r}`);
            if (el && el.value) selectedInThisGame.push(el.value);
        }
        for (let r = 1; r <= 8; r++) {
            let el = document.getElementById(`g${gameId}-r${r}`);
            if (!el) continue;
            let myValue = el.value;
            let options = el.querySelectorAll('option');
            options.forEach(opt => {
                if (opt.value === "") return;
                if (selectedInThisGame.includes(opt.value) && opt.value !== myValue) {
                    opt.disabled = true; opt.innerText = `[Locked] ${opt.value}`;
                } else {
                    opt.disabled = false; opt.innerText = opt.value;
                }
            });
        }
    }

    function handleSelection(gameId, rank, playerName) {
        if (!isAdmin) return;
        refreshDropdownOptions(gameId);
        // Instant sync on change. Feedback provided implicitly by UI updates.
        db.ref(`tournaments/${CURRENT_ROOM}/results/${gameId}/${rank}`).set(playerName);
    }

    function switchTab(gameId) {
        document.querySelectorAll('.tab-btn').forEach((btn, index) => btn.classList.toggle('active', index + 1 === gameId));
        document.querySelectorAll('.game-content').forEach(content => content.classList.remove('active'));
        const activeContent = document.getElementById(`game-${gameId}`);
        if(activeContent) activeContent.classList.add('active');
    }

    function updateLeaderboardUI() {
        let leaderboard = players.map(p => ({ name: p, g1: 0, g2: 0, g3: 0, total: 0 }));

        for (let g = 1; g <= 3; g++) {
            if (gameResults[g]) {
                for (let rank = 1; rank <= 8; rank++) {
                    let playerName = gameResults[g][rank];
                    if (playerName) {
                        let points = POINT_SYSTEM[rank-1];
                        let pData = leaderboard.find(p => p.name === playerName);
                        if (pData) {
                            if (g === 1) pData.g1 = points;
                            if (g === 2) pData.g2 = points;
                            if (g === 3) pData.g3 = points;
                            pData.total += points;
                        }
                    }
                }
            }
        }
        leaderboard.sort((a, b) => b.total - a.total);
        const tbody = document.getElementById('leaderboard-body');
        tbody.innerHTML = '';

        leaderboard.forEach((p, index) => {
            let rankClass = index === 0 ? 'rank-1' : (index === 1 ? 'rank-2' : (index === 2 ? 'rank-3' : ''));
            tbody.innerHTML += `
            <tr>
                <td class="${rankClass}">#${index + 1}</td>
                <td class="${rankClass}" style="font-weight:600;">${p.name}</td>
                <td style="color:${p.g1>0?'var(--success)':(p.g1<0?'var(--danger)':'var(--text-muted)')}">${p.g1}</td>
                <td style="color:${p.g2>0?'var(--success)':(p.g2<0?'var(--danger)':'var(--text-muted)')}">${p.g2}</td>
                <td style="color:${p.g3>0?'var(--success)':(p.g3<0?'var(--danger)':'var(--text-muted)')}">${p.g3}</td>
                <td style="font-weight:800; font-size:1.15em; text-align:right;">${p.total}</td>
            </tr>`;
        });
    }

    /** ==========================================
     *  ADMIN ACTIONS
     *  ========================================== */
    async function saveSetupToFirebase() {
        if(isProcessing) return;
        const confirmed = await UI.confirm("Initialize Tournament?", "This will lock in the roster for this table.");
        if(!confirmed) return;

        isProcessing = true;
        UI.setLoading('btn-save-setup', true);

        let newPlayers = [];
        for (let i = 1; i <= 8; i++) {
            let name = document.getElementById(`p${i}`).value.trim();
            if(!name) name = `Commander ${i}`;
            newPlayers.push(name);
        }
        
        db.ref(`tournaments/${CURRENT_ROOM}`).set({
            players: newPlayers,
            results: { 1: {}, 2: {}, 3: {} }
        }).then(() => UI.toast("Tournament Initialized!"))
          .finally(() => { isProcessing = false; UI.setLoading('btn-save-setup', false); });
    }

    async function resetTournament() {
        if(isProcessing) return;
        const confirmed = await UI.confirm("TERMINATE TABLE?", `This will permanently wipe Table ${CURRENT_ROOM}. All match data will be lost forever.`, true);
        if(!confirmed) return;

        isProcessing = true;
        UI.setLoading('btn-del-room', true);

        db.ref(`tournaments/${CURRENT_ROOM}`).remove().then(() => {
            UI.toast("Table terminated.", "info");
            setTimeout(() => window.location.href = 'mcgg.html', 1500); // Redirect to portal
        }).finally(() => { isProcessing = false; UI.setLoading('btn-del-room', false); });
    }
    
    function showSetup() {
        document.getElementById('setup-section').classList.remove('hidden');
        document.getElementById('app-section').style.display = 'none';
        players.forEach((p, i) => { if(document.getElementById(`p${i+1}`)) document.getElementById(`p${i+1}`).value = p; });
    }

    function verifyAdmin() {
        const pass = document.getElementById('admin-pass').value;
        if(pass === "admin123") {
            isAdmin = true;
            document.getElementById('btn-login').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
            document.getElementById('ui-overlay').classList.remove('active');
            
            let selects = document.querySelectorAll('select');
            selects.forEach(s => s.disabled = false);
            
            if(players.length === 0) document.getElementById('setup-section').classList.remove('hidden');
            generateGameForms();
            UI.toast("Master Override Engaged", "success");
        } else {
            UI.permissionDenied("Invalid Authorization Code");
        }
    }
</script>

</html>
