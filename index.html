<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PLAY LUNA - GAMING HUB</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050508">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,1,0" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            /* Palet Warna Kosmik */
            --bg-base: #050508;
            --panel-bg: rgba(18, 18, 28, 0.45);
            --card-bg: rgba(25, 25, 35, 0.5);
            --card-hover: rgba(45, 45, 60, 0.8);
            
            /* Warna Identitas Aplikasi */
            --or-accent: #a855f7; /* Ungu Orasi */
            --mc-accent: #6366f1; /* Indigo MCGG */
            --ud-accent: #f59e0b; /* Amber Undian */
            --rs-accent: #f39c12; /* Oranye Remi */
            --gw-accent: #00FF9D; /* Hijau Ular Tangga */
            --rr-accent: #f43f5e; /* Merah Muda Refleksi */
            --ww-accent: #ffd369; /* Emas Werewolf */
            
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-line: rgba(255, 255, 255, 0.08);
            --radius-main: 24px;
            --radius-card: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        /* LAYOUT UTAMA: Anti-Scroll, Terpusat */
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 20% 0%, rgba(99, 102, 241, 0.12), transparent 40%),
                radial-gradient(circle at 80% 100%, rgba(244, 63, 94, 0.12), transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.08), transparent 50%);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; 
            overscroll-behavior: none;
            padding: 10px;
        }

        /* MAIN DASHBOARD PANEL */
        .dashboard-container {
            width: 100%;
            max-width: 460px;
            height: 100%;
            max-height: 820px;
            background: var(--panel-bg);
            border: 1px solid var(--border-line);
            border-radius: var(--radius-main);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            padding: 20px 15px;
            position: relative;
            animation: fadeIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* TOMBOL REFRESH / CLEAR CACHE */
        .btn-clear {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-line);
            color: var(--text-sub);
            border-radius: 50%;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-clear .material-symbols-rounded { font-size: 18px; }
        .btn-clear:hover {
            background: rgba(244, 63, 94, 0.15);
            color: var(--rr-accent);
            border-color: var(--rr-accent);
            transform: rotate(180deg) scale(1.1);
        }

        /* HEADER */
        .header { 
            text-align: center; 
            margin-bottom: 20px;
            margin-top: 5px;
            flex-shrink: 0;
        }
        .logo { 
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem; 
            font-weight: 800; 
            letter-spacing: 5px; 
            margin: 0;
            background: linear-gradient(to right, var(--or-accent), var(--mc-accent), var(--gw-accent));
            background-size: 200% auto;
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
            animation: shine 5s linear infinite;
        }
        .subtitle { 
            font-size: 0.65rem; 
            font-weight: 700; 
            letter-spacing: 4px; 
            color: var(--text-sub); 
            text-transform: uppercase; 
            margin-top: -2px;
        }

        /* 
         * INPUT NAMA (Revolusi UX: Minimalis, tanpa box besar) 
         */
        .user-setup {
            width: 100%;
            margin-bottom: 20px;
            padding: 0 10px;
            flex-shrink: 0;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-line);
            border-radius: 50px; /* Bentuk Pill */
            padding: 4px;
            transition: all 0.3s ease;
        }
        .input-wrapper:focus-within {
            background: rgba(0, 0, 0, 0.6);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.15);
        }
        .input-icon {
            position: absolute;
            left: 18px;
            color: var(--text-sub);
            font-size: 20px;
            transition: color 0.3s;
        }
        .input-wrapper:focus-within .input-icon {
            color: var(--mc-accent);
        }
        input.player-input {
            width: 100%; 
            padding: 12px 20px 12px 48px; 
            border: none;
            background: transparent; 
            color: var(--text-main); 
            font-family: 'Inter', sans-serif; 
            font-size: 0.95rem; 
            font-weight: 500;
            outline: none; 
            text-align: center;
            letter-spacing: 0.5px;
        }
        input.player-input::placeholder { 
            color: rgba(255,255,255,0.25); 
            font-weight: 400; 
        }

        /* GRID MENU (Grid 2 Kolom, Presisi) */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            flex-grow: 1; /* Mengisi ruang sisa */
            align-content: stretch;
            padding: 0 5px;
        }

        /* DESAIN KARTU */
        .game-card {
            background: var(--card-bg); 
            border-radius: var(--radius-card); 
            position: relative; 
            border: 1px solid var(--border-line);
            display: flex; 
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
            cursor: pointer; 
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .game-card:active { transform: scale(0.94); }

        /* Animasi berantai masuknya kartu */
        .game-card { opacity: 0; animation: fadeUpCard 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        .game-card:nth-child(1) { animation-delay: 0.1s; }
        .game-card:nth-child(2) { animation-delay: 0.15s; }
        .game-card:nth-child(3) { animation-delay: 0.2s; }
        .game-card:nth-child(4) { animation-delay: 0.25s; }
        .game-card:nth-child(5) { animation-delay: 0.3s; }
        .game-card:nth-child(6) { animation-delay: 0.35s; }
        .game-card:nth-child(7) { animation-delay: 0.4s; }

        /* Icon & Text Styling */
        .card-icon { 
            font-size: 2rem; 
            margin-bottom: 6px;
            z-index: 2; 
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
        }
        .game-card:hover .card-icon { transform: translateY(-3px) scale(1.1); }
        
        .card-title { 
            font-size: 0.85rem; 
            font-weight: 700; 
            margin: 0; 
            text-align: center;
            z-index: 2;
            letter-spacing: 0.5px;
        }

        /* Glow Effect di dalam kartu */
        .card-glow { 
            position: absolute; width: 100%; height: 100%; opacity: 0.05; 
            top: 0; left: 0; transition: opacity 0.4s;
            pointer-events: none;
        }
        .game-card:hover .card-glow { opacity: 0.25; }
        .game-card:hover { 
            background: var(--card-hover); 
            border-color: rgba(255,255,255,0.2); 
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        /* PRIORITAS LAYOUT KARTU */
        /* Baris 1: Orasi (Lebar Penuh) */
        .game-card:nth-child(1) { 
            grid-column: span 2; 
            flex-direction: row; 
            justify-content: flex-start; 
            padding: 0 25px;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.15), var(--card-bg));
            border-color: rgba(168, 85, 247, 0.2);
        }
        .game-card:nth-child(1) .card-icon { font-size: 2.8rem; margin-bottom: 0; margin-right: 20px; color: var(--or-accent);}
        .game-card:nth-child(1) .card-title { font-size: 1.2rem; text-align: left; }
        .card-subtitle { display: none; }
        .game-card:nth-child(1) .card-subtitle { display: block; font-size: 0.75rem; color: var(--text-sub); font-weight: 500; margin-top: 3px;}
        .game-card:nth-child(1) .card-glow { background: radial-gradient(circle at right, var(--or-accent), transparent 70%); }
        .game-card:nth-child(1):hover .card-icon { transform: translateX(5px) scale(1.05); }

        /* Tema Sisa 6 Kartu (Terbagi rata 2 Kolom x 3 Baris) */
        .theme-mc .card-icon { color: var(--mc-accent); }
        .theme-mc .card-glow { background: radial-gradient(circle at top, var(--mc-accent), transparent); }

        .theme-ud .card-icon { color: var(--ud-accent); }
        .theme-ud .card-glow { background: radial-gradient(circle at top, var(--ud-accent), transparent); }

        .theme-rs .card-icon { color: var(--rs-accent); }
        .theme-rs .card-glow { background: radial-gradient(circle at top, var(--rs-accent), transparent); }

        .theme-gw .card-icon { color: var(--gw-accent); }
        .theme-gw .card-glow { background: radial-gradient(circle at top, var(--gw-accent), transparent); }

        .theme-rr .card-icon { color: var(--rr-accent); }
        .theme-rr .card-glow { background: radial-gradient(circle at top, var(--rr-accent), transparent); }

        .theme-ww .card-icon { color: var(--ww-accent); }
        .theme-ww .card-glow { background: radial-gradient(circle at top, var(--ww-accent), transparent); }

        /* FOOTER */
        .footer { 
            margin-top: 18px;
            font-size: 0.7rem; 
            color: #64748b; 
            letter-spacing: 1.5px; 
            text-align: center; 
            font-weight: 500; 
            flex-shrink: 0;
            opacity: 0;
            animation: fadeIn 1s 0.6s forwards;
        }
        .footer a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 700;
            transition: color 0.3s;
        }
        .footer a:hover { color: var(--or-accent); }

        /* ANIMASI KUNCI */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeUpCard { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shine { to { background-position: 200% center; } }
        
        /* Modifikasi SweetAlert */
        .swal2-dark-theme {
            background: rgba(18, 18, 28, 0.95) !important;
            backdrop-filter: blur(20px) !important;
            border: 1px solid var(--border-line) !important;
            border-radius: var(--radius-main) !important;
            color: #fff !important;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6) !important;
        }

        /* Penyesuaian Responsif untuk Layar HP Mungil (Tinggi < 680px) */
        @media (max-height: 680px) {
            .dashboard-container { padding: 15px 12px; }
            .logo { font-size: 1.8rem; }
            .user-setup { margin-bottom: 12px; }
            input.player-input { padding: 10px 15px 10px 40px; font-size: 0.9rem;}
            .menu-grid { gap: 8px; }
            .game-card { padding: 8px; }
            .card-icon { font-size: 1.6rem; margin-bottom: 3px; }
            .card-title { font-size: 0.75rem; }
            .game-card:nth-child(1) .card-icon { font-size: 2.2rem; }
            .game-card:nth-child(1) .card-title { font-size: 1rem; }
            .footer { margin-top: 10px; font-size: 0.65rem;}
        }
    </style>
</head>
<body>

    <!-- Main Container Dashboard -->
    <div class="dashboard-container">
        
        <!-- Tombol Clear Cache -->
        <button class="btn-clear" onclick="clearData()" title="Hapus Memori Lokal">
            <span class="material-symbols-rounded">refresh</span>
        </button>

        <!-- Header -->
        <div class="header">
            <h1 class="logo">PLAY LUNA</h1>
            <div class="subtitle">GAMING & TOURNAMENT HUB</div>
        </div>

        <!-- Input Nama (Pill Design - Sangat Elegan & Tidak Mengganggu) -->
        <div class="user-setup">
            <div class="input-wrapper">
                <span class="material-symbols-rounded input-icon">face</span>
                <input type="text" id="globalName" class="player-input" placeholder="Siapa namamu?" oninput="saveGlobalName()" autocomplete="off" spellcheck="false">
            </div>
        </div>

        <!-- Bento Grid: 7 Aplikasi (Penuh & Proporsional) -->
        <div class="menu-grid">
            
            <!-- 1. ORASI (Prioritas Teratas) -->
            <div class="game-card theme-or" onclick="launchGame('orasi')">
                <div class="card-glow"></div>
                <span class="material-symbols-rounded card-icon">mic_external_on</span>
                <div>
                    <h2 class="card-title">Orasi Speaking</h2>
                    <span class="card-subtitle">Latih mental public speakingmu</span>
                </div>
            </div>

            <!-- 2. MCGG -->
            <div class="game-card theme-mc" onclick="launchGame('mcgg')">
                <div class="card-glow"></div>
                <span class="material-symbols-rounded card-icon">emoji_events</span>
                <h2 class="card-title">MCGG Turnamen</h2>
            </div>

            <!-- 3. UNDIAN -->
            <div class="game-card theme-ud" onclick="launchGame('undian')">
                <div class="card-glow"></div>
                <span class="material-symbols-rounded card-icon">redeem</span>
                <h2 class="card-title">Undian Hadiah</h2>
            </div>

            <!-- 4. REMI SUROBOYOAN -->
            <div class="game-card theme-rs" onclick="launchGame('remi')">
                <div class="card-glow"></div>
                <span class="material-symbols-rounded card-icon">style</span>
                <h2 class="card-title">Remi Kartu</h2>
            </div>

            <!-- 5. ULAR TANGGA -->
            <div class="game-card theme-gw" onclick="launchGame('geometry')">
                <div class="card-glow"></div>
                <span class="material-symbols-rounded card-icon">casino</span>
                <h2 class="card-title">Ular Tangga</h2>
            </div>

            <!-- 6. RUANG REFLEKSI -->
            <div class="game-card theme-rr" onclick="launchGame('refleksi')">
                <div class="card-glow"></div>
                <span class="material-symbols-rounded card-icon">volunteer_activism</span>
                <h2 class="card-title">Ruang Refleksi</h2>
            </div>

            <!-- 7. WEREWOLF -->
            <div class="game-card theme-ww" onclick="launchGame('werewolf')">
                <div class="card-glow"></div>
                <span class="material-symbols-rounded card-icon">nightlight_round</span>
                <h2 class="card-title">Werewolf Village</h2>
            </div>

        </div>

        <!-- Footer -->
        <div class="footer">
            PLAY LUNA • by <a href="https://www.instagram.com/mas_uuth/" target="_blank" rel="noopener noreferrer">Mas Uuth</a>
        </div>

    </div>

    <script>
        // Memuat Nama yang Tersimpan
        window.onload = () => {
            const savedName = localStorage.getItem("luna_global_name");
            if(savedName) document.getElementById("globalName").value = savedName;
        };

        // Fitur Pembersih Cache & Refresh
        function clearData() {
            Swal.fire({
                title: 'Bersihkan Sistem?',
                text: "Semua memori sesi dan profil PlayLuna akan dihapus.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#f43f5e',
                cancelButtonColor: 'rgba(255,255,255,0.1)',
                confirmButtonText: 'Ya, Bersihkan!',
                cancelButtonText: 'Batal',
                customClass: { popup: 'swal2-dark-theme' }
            }).then((result) => {
                if (result.isConfirmed) {
                    localStorage.clear();
                    location.reload(); 
                }
            });
        }

        // Simpan Nama ke Ekosistem Lokal
        function saveGlobalName() {
            const name = document.getElementById("globalName").value.trim();
            localStorage.setItem("luna_global_name", name);
            localStorage.setItem("ww_name", name.toUpperCase());  
            localStorage.setItem("ut_name", name);                
            localStorage.setItem("myPlayerName", name);           
        }

        // Logika Perpindahan Aplikasi
        function launchGame(game) {
            const name = document.getElementById("globalName").value.trim();
            
            // Aturan Wajib Nama (Kecuali Orasi dan MCGG yang bisa dimainkan anonim)
            if(!name && game !== 'mcgg' && game !== 'orasi') { 
                Swal.fire({
                    title: 'Akses Terkunci',
                    text: 'Silakan isi namamu terlebih dahulu pada kolom yang tersedia.',
                    icon: 'error',
                    confirmButtonColor: '#6366f1',
                    customClass: { popup: 'swal2-dark-theme' }
                });
                
                // Efek visual peringatan pada form
                const inputWrapper = document.querySelector('.input-wrapper');
                inputWrapper.style.transform = "scale(1.02) translateX(-5px)";
                inputWrapper.style.borderColor = "#f43f5e";
                
                setTimeout(() => inputWrapper.style.transform = "translateX(5px)", 100);
                setTimeout(() => inputWrapper.style.transform = "translateX(-5px)", 200);
                setTimeout(() => {
                    inputWrapper.style.transform = "scale(1) translateX(0)";
                    inputWrapper.style.borderColor = "var(--border-line)";
                }, 300);
                
                document.getElementById("globalName").focus();
                return;
            }
            
            saveGlobalName(); 
            
            // Transisi elegan sebelum pindah rute
            const routes = {
                'orasi': 'orasi.html',        
                'mcgg': 'mcgg.html',
                'werewolf': 'werewolf.html',
                'geometry': 'ulartangga.html',
                'refleksi': 'ngobrolyuk.html',
                'remi': 'remi_suroboyoan.html',
                'undian': 'undian.html'
            };
            
            if(routes[game]) {
                setTimeout(() => {
                    window.location.href = routes[game];
                }, 200);
            }
        }

        // Pendaftaran Service Worker untuk performa PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .catch(err => console.log('SW Registration Gagal:', err));
            });
        }
    </script>
</body>
</html>
